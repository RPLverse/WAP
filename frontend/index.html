<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Root HTML document.
      This file is intentionally minimal: the application is fully
      bootstrapped and rendered by Vue via JavaScript.
    -->
    <title>WAP Project</title>
  </head>
  <body>

      Root container where the Vue application is mounted.
    -->

      Entry point of the frontend application.

    -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
