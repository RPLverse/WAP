# Nginx configuration for the production frontend container.
# It serves the compiled Vue SPA and proxies /api requests to the backend
# over Docker's internal network. The browser therefore talks to one origin
# only (the frontend container), so the application is not tied to localhost.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Backend REST API reverse proxy.
  location /api/ {
    # API responses are dynamic, so they should not be cached by the browser.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    proxy_hide_header ETag;
    proxy_hide_header Last-Modified;
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    proxy_pass http://app:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vue Router history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
