# Two-container deployment:
# - web: one Node/Express container serving both the REST API and the built Vue static files
# - db: PostgreSQL database

services:
  web:
    build: .
    container_name: wap-costantini-web
    environment:
      PORT: 3000
      DATABASE_URL: postgres://wap:wap@db:5432/wap
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-8080}:3000"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: wap-costantini-db
    environment:
      POSTGRES_DB: wap
      POSTGRES_USER: wap
      POSTGRES_PASSWORD: wap
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

volumes:
  pgdata:
